<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Hacker Spotted</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { touch-action: none; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hint {
    position: fixed; bottom: calc(10px + env(safe-area-inset-bottom)); left: 0; right: 0;
    text-align: center; font: 12px monospace; color: #1fa80f; opacity: .7; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<canvas id="bug" role="img" aria-label="A bug made of green digits crawling over falling digit rain"></canvas>
<div id="hint">tap to call the bug</div>
<script src="/bug.js"></script>
<script>
(() => {
  const NEON = '#39ff14';
  const COLORS = { 1: '#1fa80f', 2: '#39ff14', 3: '#c8ffb8' };
  const rainCanvas = document.getElementById('rain');
  const bugCanvas = document.getElementById('bug');
  const rainCtx = rainCanvas.getContext('2d');
  const bugCtx = bugCanvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W, H, font, cellW, cellH, cols, rows, drops, digits;
  const randDigit = () => String(Math.floor(Math.random() * 10));

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    for (const c of [rainCanvas, bugCanvas]) {
      c.width = Math.round(W * dpr);
      c.height = Math.round(H * dpr);
      c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    // about 60 columns on a phone, capped so big screens stay crisp
    font = Math.max(9, Math.min(16, W / 45));
    cellW = font * 0.62;
    cellH = font * 1.1;
    cols = Math.ceil(W / cellW);
    rows = Math.ceil(H / cellH);
    // each rain column: current row of its head and how fast it falls (rows per step)
    drops = Array.from({ length: cols }, () => ({ y: Math.random() * -rows, speed: 0.4 + Math.random() * 0.8 }));
    digits = Array.from({ length: rows * cols }, randDigit);
    rainCtx.fillStyle = '#000';
    rainCtx.fillRect(0, 0, W, H);
    bug.size = Math.min(W, H) * 0.55;
    bug.x = Math.min(Math.max(bug.x || W / 2, 0), W);
    bug.y = Math.min(Math.max(bug.y || H / 2, 0), H);
  }

  // ---------- falling digits (top to bottom) ----------
  function stepRain() {
    rainCtx.fillStyle = 'rgba(0, 0, 0, 0.12)'; // fade older digits to leave trails
    rainCtx.fillRect(0, 0, W, H);
    rainCtx.font = `bold ${font}px "Courier New", Menlo, monospace`;
    rainCtx.textBaseline = 'top';
    for (let c = 0; c < cols; c++) {
      const d = drops[c];
      const prev = Math.floor(d.y);
      d.y += d.speed;
      const head = Math.floor(d.y);
      for (let r = prev + 1; r <= head; r++) {
        if (r < 0) continue;
        rainCtx.fillStyle = '#0f6b08';
        rainCtx.fillText(randDigit(), c * cellW, (r - 1) * cellH); // dim trail
        rainCtx.fillStyle = '#2fd010';
        rainCtx.fillText(randDigit(), c * cellW, r * cellH); // brighter head
      }
      if (d.y > rows && Math.random() > 0.97) {
        d.y = -Math.random() * 10;
        d.speed = 0.4 + Math.random() * 0.8;
      }
    }
  }

  // ---------- the crawling bug ----------
  const bug = { x: 0, y: 0, heading: -Math.PI / 2, turn: 0, phase: 0, speed: 0, target: null };

  function moveBug(dt) {
    const margin = bug.size * 0.6;
    let desired;
    if (bug.target) {
      const dx = bug.target.x - bug.x;
      const dy = bug.target.y - bug.y;
      if (Math.hypot(dx, dy) < bug.size * 0.08) bug.target = null;
      else desired = Math.atan2(dy, dx);
    }
    if (desired === undefined) {
      // wander: drift the turn rate randomly
      bug.turn += (Math.random() - 0.5) * 3 * dt;
      bug.turn = Math.max(-1.2, Math.min(1.2, bug.turn));
      // steer back toward the middle near the edges
      if (bug.x < margin || bug.x > W - margin || bug.y < margin || bug.y > H - margin) {
        desired = Math.atan2(H / 2 - bug.y, W / 2 - bug.x);
      }
    }
    if (desired !== undefined) {
      let diff = desired - bug.heading;
      diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      bug.turn = Math.max(-2.5, Math.min(2.5, diff * 3));
    }
    bug.heading += bug.turn * dt;

    const targetSpeed = bug.size * (bug.target ? 0.6 : 0.3); // px per second
    bug.speed += (targetSpeed - bug.speed) * Math.min(1, dt * 3);
    const dist = bug.speed * dt;
    bug.x += Math.cos(bug.heading) * dist;
    bug.y += Math.sin(bug.heading) * dist;
    // never let the bug wander off screen
    const keep = bug.size * 0.4;
    bug.x = Math.max(keep, Math.min(W - keep, bug.x));
    bug.y = Math.max(keep, Math.min(H - keep, bug.y));
    // legs cycle in step with distance travelled
    bug.phase += (dist / bug.size) * 28;
  }

  // brightness pattern that sticks to the bug's body as it moves
  function level(u, v) {
    const h = Math.sin(Math.round(u * 1.3) * 12.9898 + Math.round(v * 0.8) * 78.233) * 43758.5453;
    const n = h - Math.floor(h);
    return n < 0.07 ? 0 : n < 0.4 ? 1 : n < 0.8 ? 2 : 3;
  }

  function drawBug() {
    bugCtx.clearRect(0, 0, W, H);
    bugCtx.font = `bold ${font}px "Courier New", Menlo, monospace`;
    bugCtx.textBaseline = 'top';
    // rotate screen points into the bug's own space, where its head points up
    const phi = bug.heading + Math.PI / 2;
    const cos = Math.cos(phi);
    const sin = Math.sin(phi);
    const reach = bug.size * 0.72;
    const c0 = Math.max(0, Math.floor((bug.x - reach) / cellW));
    const c1 = Math.min(cols - 1, Math.ceil((bug.x + reach) / cellW));
    const r0 = Math.max(0, Math.floor((bug.y - reach) / cellH));
    const r1 = Math.min(rows - 1, Math.ceil((bug.y + reach) / cellH));

    const cells = { 1: [], 2: [], 3: [] };
    for (let r = r0; r <= r1; r++) {
      for (let c = c0; c <= c1; c++) {
        const dx = (c + 0.5) * cellW - bug.x;
        const dy = (r + 0.5) * cellH - bug.y;
        const u = ((dx * cos + dy * sin) / bug.size) * 100 + 50;
        const v = ((-dx * sin + dy * cos) / bug.size) * 100 + 50;
        if (u < 0 || u > 100 || v < 0 || v > 100) continue;
        if (!HackerBug.inside(u, v, bug.phase)) continue;
        const lv = level(u, v);
        // black backing so the rain does not show through the bug
        bugCtx.fillStyle = '#000';
        bugCtx.fillRect(c * cellW, r * cellH, cellW, cellH);
        if (lv) cells[lv].push(r * cols + c);
      }
    }
    // draw by brightness so each glow setting is applied once
    for (const lv of [1, 2, 3]) {
      bugCtx.fillStyle = COLORS[lv];
      bugCtx.shadowColor = lv === 1 ? COLORS[1] : NEON;
      bugCtx.shadowBlur = lv * 4;
      for (const i of cells[lv]) {
        bugCtx.fillText(digits[i], (i % cols) * cellW, Math.floor(i / cols) * cellH);
      }
    }
    bugCtx.shadowBlur = 0;
  }

  function flicker() {
    for (let i = 0; i < digits.length / 25; i++) {
      digits[Math.floor(Math.random() * digits.length)] = randDigit();
    }
  }

  // ---------- main loop ----------
  let last = performance.now();
  let rainClock = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    rainClock += dt;
    if (rainClock > 1 / 20) { // rain steps 20 times a second
      rainClock = 0;
      stepRain();
      flicker();
    }
    moveBug(dt);
    drawBug();
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('pointerdown', (e) => { bug.target = { x: e.clientX, y: e.clientY }; });

  resize();
  if (reduceMotion) {
    stepRain();
    drawBug();
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
